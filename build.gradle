plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
}
neoForge {
    version = neo_version
    runs { client { client() } }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
dependencies {
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': project.version, 'mod_id': mod_id, 'mod_name': mod_name,
               'minecraft_version': minecraft_version, 'neo_version': neo_version, 'minecraft_version_range': minecraft_version_range
    }
}
tasks.register('smokeTest') {
    group = 'verification'
    dependsOn testClasses
    doLast {
        javaexec {
            classpath = sourceSets.test.runtimeClasspath
            mainClass = 'dev.countergd.discordmobilebridge.presence.PresenceCoreTest'
        }
    }
}
