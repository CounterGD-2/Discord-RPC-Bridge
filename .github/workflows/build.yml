name: Build
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and smoke test
        run: gradle clean build smokeTest --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DiscordMobileBridge-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
